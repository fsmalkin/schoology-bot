x-schoology-image: &schoology-image
  image: schoology-app:latest

x-schoology-build: &schoology-build
  build: .

services:
  schoology:
    <<: [*schoology-image, *schoology-build]
    env_file: .env
    command: ["node", "src/scheduler.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - NODE_OPTIONS=--max-old-space-size=160
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 1024m
    mem_reservation: 128m
    mem_swappiness: 100
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/scheduler.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  telegram-agent:
    <<: *schoology-image
    env_file: .env
    command: ["node", "src/telegram_agent.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - NODE_OPTIONS=--max-old-space-size=160
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 1024m
    mem_reservation: 128m
    mem_swappiness: 100
    depends_on:
      - schoology
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/telegram_agent.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  dashboard:
    <<: *schoology-image
    env_file: .env
    command: ["node", "src/dashboard.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8787}:${DASHBOARD_PORT:-8787}"
    restart: unless-stopped
    init: true
    mem_limit: 192m
    memswap_limit: 768m
    mem_reservation: 96m
    mem_swappiness: 100
    depends_on:
      - schoology
      - telegram-agent
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/dashboard.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  agent-db:
    name: schoology_agent_db_prod
