x-schoology-image: &schoology-image
  image: schoology-app:latest

x-schoology-build: &schoology-build
  build: .

services:
  schoology:
    <<: [*schoology-image, *schoology-build]
    env_file: .env
    command: ["node", "src/scheduler.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - NODE_OPTIONS=--max-old-space-size=160
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 1024m
    mem_reservation: 128m
    mem_swappiness: 100
    cpus: 0.35
    cpu_shares: 128
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/scheduler.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  telegram-agent:
    <<: *schoology-image
    env_file: .env
    command: ["node", "src/telegram_agent.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - NODE_OPTIONS=--max-old-space-size=160
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 1024m
    mem_reservation: 128m
    mem_swappiness: 100
    cpus: 0.35
    cpu_shares: 128
    oom_score_adj: 500
    depends_on:
      - schoology
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/telegram_agent.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  dashboard:
    <<: *schoology-image
    env_file: .env
    command: ["node", "src/dashboard.js"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
      - DASHBOARD_PORT=8787
      - DASHBOARD_HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8787}:8787"
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 1024m
    mem_reservation: 128m
    mem_swappiness: 100
    cpus: 0.35
    cpu_shares: 128
    oom_score_adj: 500
    depends_on:
      - schoology
      - telegram-agent
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/dashboard.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  dashboard-tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY:-}
      - TS_HOSTNAME=${TAILSCALE_DASHBOARD_HOSTNAME:-schoology-dashboard}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/dashboard-serve.json
      - TS_ENABLE_HEALTH_CHECK=true
    volumes:
      - dashboard-tailscale-state:/var/lib/tailscale
      - ./tailscale/dashboard-serve.json:/config/dashboard-serve.json:ro
    network_mode: "service:dashboard"
    depends_on:
      - dashboard
    restart: unless-stopped
    init: true
    cpus: 0.10
    cpu_shares: 64
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  agent-db:
    name: schoology_agent_db_prod
  dashboard-tailscale-state:
    name: schoology_dashboard_tailscale_state
