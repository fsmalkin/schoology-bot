services:
  schoology:
    build: .
    env_file: .env
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/scheduler.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  telegram-agent:
    build: .
    env_file: .env
    command: ["npm", "run", "agent:telegram"]
    environment:
      - AGENT_DB_PATH=/app/db/agent.db
    volumes:
      - ./data:/app/data
      - agent-db:/app/db
    restart: unless-stopped
    init: true
    depends_on:
      - schoology
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/telegram_agent.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  agent-db:
    name: schoology_agent_db_prod
