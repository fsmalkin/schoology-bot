services:
  schoology:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"node src/scheduler.js\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
